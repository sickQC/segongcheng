name: Project CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI uses disposable runner data and model mocks; no repository secrets are needed.
env:
  PYTHONUTF8: '1'
  LLM_API_KEY: ''
  LLM_MODEL: ''
  LLM_BASE_URL: http://127.0.0.1:9/v1
  C_LLM_BACKEND: api
  C_LLM_MODEL: ''
  SEED_PASSWORD: ci-test-only-password

jobs:
  quality:
    name: Quality / Python and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.17.0
      - name: Python code quality
        run: python -m ruff check --config ruff.toml backend scripts deploy
      - name: Install checksum-verified secret scanner
        run: python scripts/install_quality_tools.py
      - name: Test secret detector using an invalid generated canary
        run: python scripts/check_secrets.py --self-test
      - name: Scan current deliverable files and full fetched history
        run: python scripts/check_secrets.py --history
      - name: Upload sanitized scan summary only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-summary
          path: .local/ci/secret-scan-summary.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  backend:
    name: Backend / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DATABASE_URL: 'sqlite:///:memory:'
      RUN_POSTGRES_TESTS: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install locked dependencies
        run: |
          python -m pip install -r backend/requirements-lock.txt
          python -m pip install --no-deps -e ./backend
          python -m pip check
      - name: Backend regression (includes temporary SQLite migration tests)
        run: python -m pytest backend/tests -q --tb=short --junitxml=.local/ci/backend.xml
      - name: Evaluate baseline and E7 on identical fixed cases
        run: python scripts/eval_recommendation.py --output .local/ci/e7-evaluation.json
      - name: E7 multi-seed experiment with paired intervals
        run: python scripts/eval_e7_experiment.py --output .local/ci/e7-experiment.json
      - name: Generate isolated synthetic learning data
        run: python scripts/simulate_learning.py --output .local/ci/learning-simulator
      - name: Validate scale, truth separation and event consistency
        run: python scripts/validate_simulator.py .local/ci/learning-simulator --report .local/ci/simulator-validation.json
      - name: Upload test and evaluation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports-${{ matrix.os }}
          path: .local/ci/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  postgres:
    name: Backend / PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci-disposable-password
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://ci_user:ci-disposable-password@127.0.0.1:5432/ci_test
      RUN_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install locked dependencies
        run: |
          python -m pip install -r backend/requirements-lock.txt
          python -m pip install --no-deps -e ./backend
          python -m pip check
      # Only this fresh service container is migrated, never a developer database.
      - name: PostgreSQL migration round trip
        run: |
          python -m alembic -c backend/alembic.ini upgrade head
          python -m alembic -c backend/alembic.ini downgrade base
          python -m alembic -c backend/alembic.ini upgrade head
      - name: SQLite and PostgreSQL regression
        run: python -m pytest backend/tests -q --tb=short --junitxml=.local/ci/postgres.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-report
          path: .local/ci/postgres.xml
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  frontend:
    name: Frontend / Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lecture Markdown regression
        run: npm run test:markdown
      - name: Type check and production build
        run: npm run build
      - name: Upload frontend build for review
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
          if-no-files-found: error

  deployment:
    name: Deployment / Compose smoke
    needs: [quality, backend, postgres, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_DB_PASSWORD: ci-disposable-database-password
      DEPLOY_SEED_PASSWORD: ci-test-only-password
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate Compose without printing resolved environment
        run: docker compose --env-file deploy/.env.example -f deploy/compose.app.yaml config --quiet
      - name: Build and start isolated app and database
        run: docker compose --env-file deploy/.env.example -f deploy/compose.app.yaml up --build -d --wait --wait-timeout 180
      - name: Check deployed application
        run: python scripts/smoke_deployment.py --base-url http://127.0.0.1:8080
      - name: Sample non-AI read API latency at concurrency ten
        env:
          BENCHMARK_PASSWORD: ci-test-only-password
        run: python scripts/benchmark_read_api.py --base-url http://127.0.0.1:8080
      - name: Upload read benchmark (latency recorded, not a hardware-dependent gate)
        uses: actions/upload-artifact@v7
        with:
          name: read-api-benchmark
          path: .local/ci/read-api-benchmark.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Restart application with persistent database
        run: |
          docker compose --env-file deploy/.env.example -f deploy/compose.app.yaml restart app
          docker compose --env-file deploy/.env.example -f deploy/compose.app.yaml up -d --wait --wait-timeout 180
          python scripts/smoke_deployment.py --base-url http://127.0.0.1:8080
      - name: Stop disposable CI containers (keep volumes)
        if: always()
        run: docker compose --env-file deploy/.env.example -f deploy/compose.app.yaml down
