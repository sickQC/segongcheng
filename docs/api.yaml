  schemas:
    AnswerIn:
      properties:
        question_id:
          type: string
          maxLength: 100
          minLength: 1
          title: Question Id
        value:
          items:
            type: string
          type: array
          maxItems: 100
          title: Value
      additionalProperties: false
      type: object
      required:
      - question_id
      - value
      title: AnswerIn
    AnswerResultOut:
      properties:
        question_id:
          type: string
          title: Question Id
        correct:
          type: boolean
          title: Correct
        explanation:
          type: string
          title: Explanation
      type: object
      required:
      - question_id
      - correct
      - explanation
      title: AnswerResultOut
    AttemptOut:
      properties:
        id:
          type: string
          title: Id
        quiz_id:
