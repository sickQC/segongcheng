services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: se_learning
      POSTGRES_USER: se_learning
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在根目录 .env 中设置 POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U se_learning -d se_learning"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
